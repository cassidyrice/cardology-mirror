<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'"><title>Card Blueprints</title><link rel="stylesheet" href="style.css"></head><body>
<aside><div class="brand"><span>♠</span><h1>Card Blueprints</h1></div><form id="birth-form"><label for="birthday">Birthday</label><input type="date" id="birthday" required><label for="target">Reading date</label><input type="date" id="target" required><button class="primary" type="submit">Generate spread</button></form><p id="error" role="alert"></p><nav aria-label="Spreads"></nav><p class="offline">● Engine ready · offline</p></aside>
<main><header><div><h2 id="title">Annual spread</h2><p id="subtitle">Every position, calculated from your birthday.</p></div><div class="actions"><button id="export" disabled>Export JSON</button><button id="print" disabled>Print</button></div></header><div id="summary"></div><div id="anchors" role="tablist" aria-label="Anchor card"></div><div id="content"><div class="empty"><span>♠</span><h3>Your complete card blueprint</h3><p>Enter a birthday and reading date to explore every spread position.</p></div></div><p id="status" role="status"></p></main>
<dialog id="detail"><button id="close-detail" aria-label="Close card details">Close</button><div id="detail-content"></div></dialog><script src="app.js"></script></body></html>
