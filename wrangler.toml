name = "cardology-mirror"
pages_build_output_dir = ".vercel/output/static"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[[analytics_engine_datasets]]
binding = "FUNNEL_ANALYTICS"
dataset = "cardblueprints_funnel"

[[r2_buckets]]
binding = "EBOOK_BUCKET"
bucket_name = "cardblueprints-ebooks"

# Release requirement: provision D1 and apply migrations before enabling fulfillment.
[[d1_databases]]
binding = "READING_ORDERS"
database_name = "cardblueprints-reading-orders"
database_id = "fcbf0442-2836-4dca-b27d-c969d572aab7"
migrations_dir = "migrations"

# Read-only compatibility with ac5f70b's saved readings.
[[kv_namespaces]]
binding = "READINGS"
id = "468369b7e1ae4380a111efbe50dd253c"
