name = "cardology-mirror"
pages_build_output_dir = ".vercel/output/static"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[[analytics_engine_datasets]]
binding = "FUNNEL_ANALYTICS"
dataset = "cardblueprints_funnel"

[[r2_buckets]]
binding = "EBOOK_BUCKET"
bucket_name = "cardblueprints-ebooks"

# Content Engine paid calendars (30-day re-download). Create the namespace in CF
# and set id before deploy; missing binding = graceful "generation pending".
[[kv_namespaces]]
binding = "CONTENT_CALENDARS"
id = "CONTENT_CALENDARS_PLACEHOLDER"
