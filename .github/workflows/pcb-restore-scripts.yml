name: pcb-restore-scripts
on:
  push:
    branches: [fix/pcb-price-13]
    paths:
      - 'scripts/_pcb_restore/**'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pcb-price-13
      - name: Assemble restored scripts
        run: |
          set -euo pipefail
          test -d scripts/_pcb_restore
          cat scripts/_pcb_restore/validate-*.txt > scripts/validate-public-truth.ts
          cat scripts/_pcb_restore/generate-*.txt > scripts/generate_daily_blog_post.ts
          grep -q 'price: 13' scripts/validate-public-truth.ts
          grep -q 'Personal Card Blueprint is a' scripts/validate-public-truth.ts
          grep -q '\$13' scripts/validate-public-truth.ts
          grep -q '\$13' scripts/generate_daily_blog_post.ts
          rm -rf scripts/_pcb_restore
          git config user.name "cassidyrice"
          git config user.email "therealcassrice@gmail.com"
          git add scripts/validate-public-truth.ts scripts/generate_daily_blog_post.ts
          git add -u scripts/_pcb_restore || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "fix(pricing): restore validate/generator with PCB $13 assertions"
          git push origin HEAD:fix/pcb-price-13
