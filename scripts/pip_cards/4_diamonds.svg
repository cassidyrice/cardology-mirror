<?xml version="1.0" encoding="UTF-8"?>
<svg width="250" height="350" viewBox="0 0 250 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Card background -->
  <rect x="0" y="0" width="250" height="350" rx="12" ry="12" fill="white" stroke="#CCCCCC" stroke-width="1"/>
  
  <!-- Top-left corner -->
  <text x="20" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E31B23" text-anchor="middle">4</text>
  <text x="20" y="48" font-family="Arial, sans-serif" font-size="16" fill="#E31B23" text-anchor="middle">♦</text>
  
  <!-- Bottom-right corner (inverted) -->
  <text x="230" y="330" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E31B23" text-anchor="middle" transform="rotate(180 230 330)">4</text>
  <text x="230" y="310" font-family="Arial, sans-serif" font-size="16" fill="#E31B23" text-anchor="middle" transform="rotate(180 230 310)">♦</text>
  
  <!-- Pips -->
  <text x="70" y="80" 
    font-family="Arial, sans-serif" 
    font-size="24" 
    fill="#E31B23" 
    text-anchor="middle" 
    dominant-baseline="central"
    transform="rotate(0 70 80)">♦</text>
  <text x="180" y="80" 
    font-family="Arial, sans-serif" 
    font-size="24" 
    fill="#E31B23" 
    text-anchor="middle" 
    dominant-baseline="central"
    transform="rotate(0 180 80)">♦</text>
  <text x="70" y="270" 
    font-family="Arial, sans-serif" 
    font-size="24" 
    fill="#E31B23" 
    text-anchor="middle" 
    dominant-baseline="central"
    transform="rotate(180 70 270)">♦</text>
  <text x="180" y="270" 
    font-family="Arial, sans-serif" 
    font-size="24" 
    fill="#E31B23" 
    text-anchor="middle" 
    dominant-baseline="central"
    transform="rotate(180 180 270)">♦</text>

</svg>