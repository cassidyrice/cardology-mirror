<?xml version="1.0" encoding="UTF-8"?>
<svg width="250" height="350" viewBox="0 0 250 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Card background -->
  <rect x="0" y="0" width="250" height="350" rx="12" ry="12" fill="white" stroke="#CCCCCC" stroke-width="1"/>
  
  <!-- Top-left corner -->
