<?xml version="1.0" encoding="UTF-8"?>
<svg width="250" height="350" viewBox="0 0 250 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Card background -->
  <rect x="0" y="0" width="250" height="350" rx="12" ry="12" fill="white" stroke="#CCCCCC" stroke-width="1"/>
  
  <!-- Top-left corner -->
  <text x="20" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1C1C1C" text-anchor="middle">A</text>
  <text x="20" y="48" font-family="Arial, sans-serif" font-size="16" fill="#1C1C1C" text-anchor="middle">♣</text>
  
  <!-- Bottom-right corner (inverted) -->
  <text x="230" y="330" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1C1C1C" text-anchor="middle" transform="rotate(180 230 330)">A</text>
  <text x="230" y="310" font-family="Arial, sans-serif" font-size="16" fill="#1C1C1C" text-anchor="middle" transform="rotate(180 230 310)">♣</text>
  
  <!-- Pips -->
  <text x="125" y="175" 
    font-family="Arial, sans-serif" 
    font-size="72" 
    fill="#1C1C1C" 
    text-anchor="middle" 
    dominant-baseline="central"
    transform="rotate(0 125 175)">♣</text>

</svg>